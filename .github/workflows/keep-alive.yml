name: Keep Alive Supabase

on:
  schedule:
    # Run every 3 days at 02:00 UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Health Endpoint
        run: |
          if [ -n "${{ secrets.APP_URL }}" ]; then
            echo "Pinging ${{ secrets.APP_URL }}/api/health..."
            curl -fsSL "${{ secrets.APP_URL }}/api/health" || true
          else
            echo "No APP_URL secret configured. You can set APP_URL in repository secrets to ping your deployed app."
          fi
